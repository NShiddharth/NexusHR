apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus-hr
data:
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.nexus-hr.svc.cluster.local:5672/"
  REDIS_URL: "redis://redis.nexus-hr.svc.cluster.local:6379/0"
  AUTH_SERVICE_URL: "http://auth-service.nexus-hr.svc.cluster.local:8001"
  DEPARTMENT_SERVICE_URL: "http://department-service.nexus-hr.svc.cluster.local:8002"
  EMPLOYEE_SERVICE_URL: "http://employee-service.nexus-hr.svc.cluster.local:8003"
  ATTENDANCE_SERVICE_URL: "http://attendance-service.nexus-hr.svc.cluster.local:8004"
  PAYROLL_SERVICE_URL: "http://payroll-service.nexus-hr.svc.cluster.local:8005"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus-hr
type: Opaque
stringData:
  POSTGRES_USER: "nexus_user"
  POSTGRES_PASSWORD: "nexus_secure_k8s_password"
  POSTGRES_DB: "nexus_employee_db"
  # SECURITY: Replace this value with a cryptographically random secret BEFORE applying to any cluster.
  # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
  # Then base64-encode if using data: instead of stringData:
  JWT_SECRET: "CHANGE_ME_generate_with_secrets.token_hex_32"
  DATABASE_URL: "postgresql://nexus_user:nexus_secure_k8s_password@postgres.nexus-hr.svc.cluster.local:5432/nexus_employee_db"
