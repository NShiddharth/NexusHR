# 1. Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexus-hr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: nexushr/auth-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: RABBITMQ_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nexus-hr
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: auth-service
---
