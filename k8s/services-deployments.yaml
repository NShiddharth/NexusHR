# 6. API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nexus-hr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nexushr/api-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: AUTH_SERVICE_URL
            - name: DEPARTMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: DEPARTMENT_SERVICE_URL
            - name: EMPLOYEE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: EMPLOYEE_SERVICE_URL
            - name: ATTENDANCE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: ATTENDANCE_SERVICE_URL
            - name: PAYROLL_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: PAYROLL_SERVICE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "400m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nexus-hr
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api-gateway
